[project]
name = "camera_module"
version = "3.0.0"
description = "A simple MADSci node module that supports taking snapshots with a camera or other video device\""
authors = [
    {name = "Ryan D. Lewis", email="ryan.lewis@anl.gov"},
    {name = "Tobias Ginsburg", email="tginsburg@anl.gov"},
]
dependencies = [
    "opencv-python-headless",
    "madsci.node_module~=0.7",
    "madsci.client~=0.7",
    "madsci.common~=0.7",
    "numpy<2",
    "pyzbar",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.urls]
homepage = "https://github.com/AD-SDL/camera_module"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "ipykernel>=6.31.0",
    "pydantic-settings-export>=1.0.3",
]

[tool.pydantic_settings_export]
project_dir = "."
default_settings = [
    "camera_rest_node:CameraNodeConfig",
]

[[tool.pydantic_settings_export.generators.markdown]]
paths = ["docs/Configuration.md"]

[[tool.pydantic_settings_export.generators.dotenv]]
paths = [".env.example"]

[tool.pdm]
distribution = true

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
